<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub</title>
    <link rel="stylesheet" href="{% static 'datahub/style.css' %}">
</head>
<body>
    <h1>DataHub</h1>
    <p>Data management platform</p>
    
    <a href="{% url 'datahub:add' %}"><button>Add record</button></a>
    <a href="{% url 'datahub:predict' %}"><button>Predict category</button></a>
    
    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Feature 1</th>
                <th>Feature 2</th>
                <th>Category</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ record.continuous_feature1 }}</td>
                <td>{{ record.continuous_feature2 }}</td>
                <td>{{ record.categorical_feature1 }}</td>
                <td>
                    <form method="POST" action="{% url 'datahub:delete' record.id %}">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
