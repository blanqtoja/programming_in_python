<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Welcome to DataHub</h1>
    <p>This is your data management platform.</p>
    <a href="{% url 'datahub:add' %}">
        <button>Add record</button>
    </a>
    <table>
    {% for record in records %}

        <tr>
            <td>
                {{ forloop.counter }} 
            </td>
            <td>
                {{ record.continuous_feature1 }}
            </td>
            <td>
                {{ record.continuous_feature2 }}
            </td>
            <td>
                {{ record.categorical_feature1 }}
            </td>
            <td>
                <form method="POST" action="{% url 'datahub:delete' record.id %}">
                    {% csrf_token %}
                    <button type="submit">X</button>
                </form>

                <!-- todo: delete later -->
                <!-- only for testing - id not found -->
                <form method="POST" action="{% url 'datahub:delete' 20 %}">
                    {% csrf_token %}
                    <button type="submit">X</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </table>
    
</body>
</html>
