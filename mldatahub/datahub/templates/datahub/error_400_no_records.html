<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not enough records</title>
    <link rel="stylesheet" href="{% static 'datahub/style.css' %}">
</head>
<body>
    <div class="message-container error-container">
        <h1>400 Bad Request</h1>
        <h2>Not enough records</h2>
        <p>{{ error_message }}</p>
        <p>The data base does not contain the appropriate number of records. A minimum of 10 records is required.</p>
        <p>Please add records before making predictions.</p>
        <a href="{% url 'datahub:add' %}">Add Record</a>
        <a href="{% url 'datahub:index' %}">Back to home</a>
    </div>
</body>
</html>
